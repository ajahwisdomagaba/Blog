<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Lumen</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Italiana&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-color: #0d0d0f;
        --card-bg: rgba(255, 255, 255, 0.03);
        --card-hover-bg: rgba(255, 255, 255, 0.05);
        --text-primary: #e8e6e1;
        --text-muted: #949086;
        --accent: #d4a373;
        --accent-glow: rgba(212, 163, 115, 0.15);
        --border-color: rgba(255, 255, 255, 0.07);
        --border-hover: rgba(212, 163, 115, 0.35);
        --font-display: "Italiana", serif;
        --font-sans: "Plus Jakarta Sans", sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-primary);
        font-family: var(--font-sans);
        line-height: 1.8;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background-image:
          radial-gradient(
            circle at 15% 20%,
            rgba(212, 163, 115, 0.06) 0%,
            transparent 45%
          ),
          radial-gradient(
            circle at 85% 80%,
            rgba(138, 100, 70, 0.05) 0%,
            transparent 50%
          );
        background-attachment: fixed;
      }

      a {
        color: inherit;
        text-decoration: none;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .header {
        max-width: 960px;
        width: 100%;
        margin: 0 auto;
        padding: 4rem 2rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border-color);
      }

      .brand {
        font-family: var(--font-display);
        font-size: 2.2rem;
        letter-spacing: 1px;
      }

      .nav-links {
        display: flex;
        gap: 2.5rem;
        list-style: none;
      }

      .nav-links a {
        font-size: 0.8rem;
        color: var(--text-muted);
        letter-spacing: 2px;
        text-transform: uppercase;
        font-weight: 500;
      }

      .nav-links a:hover {
        color: var(--accent);
      }

      .error-wrapper {
        max-width: 680px;
        width: 100%;
        margin: 4rem auto;
        padding: 0 2rem;
        text-align: center;
      }

      .error-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        padding: 4.5rem 3rem;
        border-radius: 24px;
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      }

      .status-code {
        font-family: var(--font-display);
        font-size: 6rem;
        line-height: 1;
        color: var(--accent);
        margin-bottom: 0.5rem;
        letter-spacing: 2px;
      }

      .error-title {
        font-family: var(--font-display);
        font-size: 2rem;
        font-weight: 400;
        margin-bottom: 1rem;
        letter-spacing: 0.5px;
      }

      .error-desc {
        color: var(--text-muted);
        font-weight: 300;
        font-size: 0.95rem;
        margin-bottom: 2.5rem;
        max-width: 440px;
        margin-left: auto;
        margin-right: auto;
      }

      .action-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        background: var(--accent);
        color: #0d0d0f;
        padding: 0.9rem 1.8rem;
        border-radius: 30px;
        border: 1px solid var(--accent);
        transition: all 0.3s ease;
      }

      .action-btn:hover {
        opacity: 0.92;
        box-shadow: 0 0 25px var(--accent-glow);
        transform: translateY(-2px);
      }

      .footer {
        text-align: center;
        padding: 3rem 1.5rem;
        border-top: 1px solid var(--border-color);
        font-size: 0.8rem;
        color: var(--text-muted);
        letter-spacing: 1px;
        font-weight: 300;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <a href="{% url 'home' %}" class="brand">LUMEN.</a>
      <ul class="nav-links">
        <li><a href="{% url 'home' %}">Essays</a></li>
        <li><a href="{% url 'about' %}">About</a></li>
      </ul>
    </header>

    <main class="error-wrapper">
      <div class="error-card">
        <div class="status-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-desc">
          The essay, passage, or route you are looking for has either been relocated or ceased to exist.
        </p>
        <a href="{% url 'home' %}" class="action-btn">
          Return to Journal <span>&rarr;</span>
        </a>
      </div>
    </main>

    <footer class="footer">
      <p>&copy; 2026 LUMEN JOURNAL. ALL RIGHTS RESERVED.</p>
    </footer>
  </body>
</html>
